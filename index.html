<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <div id="app" class="text-center"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        function FormInput({ activity, onChange, onSubmit }) {
            return (
                <form onSubmit={onSubmit} className="mb-3">
                    <div className="input-group">
                        <input
                            type="text"
                            className="form-control"
                            placeholder="Masukkan aktivitas"
                            value={activity}
                            onChange={onChange}
                        />
                        <button type="submit" className="btn btn-primary">Tambah</button>
                    </div>
                </form>
            );
        }

        function Content({ data }) {
            return (
                <ul className="list-group">
                    {data.map((list, index) => (
                        <li key={index} className="list-group-item mt-1">{list}</li>
                    ))}
                </ul>
            );
        }

        function TodoApp() {
            const [activity, setActivity] = React.useState("");
            const [lists, setLists] = React.useState([]);

            const handleChange = (e) => setActivity(e.target.value);
            
            function handleSubmit(e) {
                e.preventDefault();
                setLists([...lists, activity]);
                setActivity("");
            };

            return (
                <div className="card p-4 shadow-lg">
                    <h2 className="mb-4">Todo List</h2>
                    <FormInput activity={activity} onChange={handleChange} onSubmit={handleSubmit} />
                    <Content data={lists} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("app"));
        root.render(<TodoApp />);
    </script>
</body>

</html>
